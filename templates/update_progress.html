{% extends 'base.html' %}
{% block content %}
  <h2>Update Progress for: {{ report.title }}</h2>

    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <p><a href="{% url 'report_detail' report.pk %}">Back to Report</a></p>
{% endblock %}
